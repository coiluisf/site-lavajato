version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lavajato-db
    environment:
      POSTGRES_USER: lavajato
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lavajato
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavajato"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: lavajato-api
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://lavajato:password@postgres:5432/lavajato"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: lavajato
      DATABASE_PASSWORD: password
      DATABASE_NAME: lavajato
      API_PORT: 3001
      JWT_SECRET: "dev_secret_key_minimum_32_characters_long"
      JWT_REFRESH_SECRET: "dev_refresh_secret_minimum_32_characters"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
    command: pnpm dev

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: lavajato-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    command: pnpm dev

volumes:
  postgres_data:
    driver: local
