packages:
  - 'apps/*'
  - 'packages/*'
  - 'admin-panel'

# Configurações gerais
shamefully-hoist: true
strict-peer-dependencies: false

# Hostinger deployment - pin package versions (7+ days old for supply-chain policy)
overrides:
  '@babel/generator': '7.29.7'
  '@babel/parser': '7.29.7'
  '@babel/traverse': '7.29.7'
  '@babel/types': '7.29.7'
  '@napi-rs/wasm-runtime': '1.1.6'
  'baseline-browser-mapping': '2.10.43'
  'electron-to-chromium': '1.5.396'
  'fast-uri': '3.1.4'

# Allow build scripts for packages that require native builds
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'argon2'
  - 'prisma'
  - 'unrs-resolver'
